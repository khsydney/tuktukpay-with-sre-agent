# Identity for the SRE agent's executor (agent design, section 7).
# Enumerated verbs only: no delete, no secrets, no RBAC, no exec. Bootstrap once with the deployer, then stop using it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-executor
  namespace: tuktukpay
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-executor
  namespace: tuktukpay
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
    resourceNames: ["acquirer-sim", "checkout-api", "ledger", "merchant-copilot", "merchant-sim", "merchant-storefront", "payment-router", "risk-engine", "shopping-agent", "wallet-sim", "webhook-dispatcher"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-executor
  namespace: tuktukpay
subjects:
  - kind: ServiceAccount
    name: sre-executor
    namespace: tuktukpay
roleRef:
  kind: Role
  name: sre-executor
  apiGroup: rbac.authorization.k8s.io
