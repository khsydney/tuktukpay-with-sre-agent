<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War Room Act Guide</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url("/brand/Inter-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url("/brand/Inter-SemiBold.woff2") format("woff2"); }
  /* Design and colour codes taken from https://www.splunk.com/ (measured 3 Nov 2026): black page fading to deep navy, magenta and
     orange glow with signal lines at the top, gradient headings, pill buttons, navy cards, white selected tab.
     Diagram status: white normal, amber slow, hot magenta broken; line style repeats the meaning. */
  :root {
    --bg: #000000; --card: #0C1724; --tint: rgba(255, 255, 255, .1); --line: rgba(255, 255, 255, .2); --text: #FFFFFF; --dim: #D5DCE5; --faint: #A6ADB6; --idle: #6E6F75;
    --lift: inset 0 1px 0 rgba(255, 255, 255, .22), 0 2px 12px rgba(0, 0, 0, .12), 0 14px 32px rgba(0, 0, 0, .5);
    --magenta: #CE0070; --hot: #FF0F7B; --amber: #FFAB0F; --blue: #0064DA; --ink: #0C1724;
    --heading: linear-gradient(90deg, #FFAB0F 5%, #FF712B 40.5%, #FF0F7B 85.5%);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .aurora { position: absolute; top: 0; left: 0; right: 0; z-index: -1; overflow: hidden; pointer-events: none;
    background: radial-gradient(45% 75% at 67% -12%, rgba(238, 29, 98, .6), transparent 72%), radial-gradient(30% 55% at 60% -14%, rgba(249, 157, 28, .75), transparent 72%), radial-gradient(35% 70% at 100% -5%, rgba(70, 20, 170, .5), transparent 72%);
    -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent); mask-image: linear-gradient(180deg, #000 45%, transparent); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body { position: relative; z-index: 0; margin: 0; font: 400 16px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: radial-gradient(55% 1100px at 0 100%, rgba(150, 0, 80, .6), transparent 75%) no-repeat, radial-gradient(60% 1200px at 100% 100%, rgba(170, 60, 35, .6), transparent 75%) no-repeat, linear-gradient(180deg, #000 0, #00052A 620px, #000B3F 1500px, #000B3F 100%); color: var(--text); font-variant-numeric: tabular-nums; padding-bottom: 96px; }
  a { color: var(--text); }
  code, .chip { font-family: var(--mono); }
  .logo { display: block; height: 30px; width: auto; flex: none; }
  .i { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .glow .i { stroke: url(#brand-stroke); }
  .topbar { position: sticky; top: 0; z-index: 5; background: rgba(0, 0, 0, .72); backdrop-filter: blur(10px); }
  .topbar > div { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 8px 24px; }
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--text); text-decoration: none; font-size: 14px; white-space: nowrap; }
  .dots { display: flex; gap: 4px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
  .dots a { font-size: 14px; color: var(--text); padding: 6px 12px; white-space: nowrap; text-decoration: none; border-radius: 16px; }
  .dots a:hover { background: var(--tint); }
  .dots a.here { color: var(--ink); background: var(--text); font-weight: 600; }
  .dots a.running::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--hot); vertical-align: 2px; }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); white-space: nowrap; }
  .live.on { color: var(--text); font-weight: 600; }
  .live.on::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 8px var(--hot); }
  main { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  section { margin-top: 72px; }
  h2 { width: fit-content; font-size: clamp(28px, 3.4vw, 40px); font-weight: 600; line-height: 1.2; margin-bottom: 24px; background: var(--heading); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; margin-top: 72px; }
  .hero .badge .i { width: 72px; height: 72px; display: block; stroke: var(--text); }
  .hero .kicker { width: fit-content; font-size: 18px; font-weight: 600; background: var(--heading); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero h1 { width: fit-content; margin: 4px 0 16px; padding-bottom: .08em; font-size: clamp(36px, 5vw, 55px); font-weight: 600; line-height: 1.1; background: var(--heading); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .line { font-size: clamp(18px, 2vw, 20px); line-height: 1.5; max-width: 60ch; }
  .skills { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .skills .lbl { font-size: 14px; color: var(--dim); }
  .skill { font-size: 14px; color: var(--text); background: var(--tint); border-radius: 16px; padding: 4px 12px; }
  .story { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(176px, 1fr); gap: 16px; overflow-x: auto; }
  .panel { position: relative; padding: 20px; background: var(--tint); border: 1px solid transparent; border-radius: 24px; overflow: hidden; box-shadow: var(--lift); backdrop-filter: blur(8px); }
  .panel .step { display: flex; align-items: center; justify-content: space-between; color: var(--faint); font-size: 14px; font-weight: 600; }
  .panel:not(:last-child) .step::after { content: ""; width: 8px; height: 8px; border-top: 2px solid var(--faint); border-right: 2px solid var(--faint); transform: rotate(45deg); }
  .panel .pic { margin-top: 8px; }
  .panel .pic .i { width: 40px; height: 40px; display: block; }
  .panel b { display: block; font-size: 18px; font-weight: 600; line-height: 1.3; margin: 8px 0 4px; }
  .panel p { color: var(--dim); font-size: 15px; line-height: 1.4; }
  .panel.bad { border-color: var(--hot); box-shadow: 0 0 16px rgba(255, 15, 123, .35); }
  .panel.good { border-color: rgba(255, 255, 255, .8); }
  .spoiler { position: relative; }
  .hidden .spoiler > .veil { display: grid; }
  .veil { display: none; position: absolute; inset: 0; width: 100%; padding: 8px; border: 0; background: rgba(12, 23, 36, .9); backdrop-filter: blur(9px); place-items: center; text-align: center; color: var(--dim); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .veil .i { display: block; width: 32px; height: 32px; margin: 0 auto 8px; }
  .veil:hover { color: var(--text); }
  .diagram { background: var(--bg); border: 1px solid rgba(255, 255, 255, .8); border-radius: 24px; padding: 16px; position: relative; box-shadow: 0 0 24px rgba(255, 255, 255, .4); }
  .diagram .scroll { overflow-x: auto; }
  .diagram svg.flow { display: block; width: 100%; min-width: 760px; height: auto; }
  .fog { display: none; align-items: center; justify-content: center; gap: 8px; margin: 0 0 8px; padding: 8px 16px; background: var(--tint); border-radius: 24px; font-weight: 600; }
  .hidden .fog { display: flex; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 8px; font-size: 14px; color: var(--dim); }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; vertical-align: -2px; border: 2px solid; }
  .legend .l-ok { border-color: var(--text); }
  .legend .l-slow { border-color: var(--amber); border-style: dotted; }
  .legend .l-bad { border-color: var(--hot); background: var(--hot); }
  .legend .l-ai { border-color: var(--text); background: var(--blue); }
  .legend .l-guard { border-color: var(--text); border-style: double; border-width: 4px; }
  .legend .l-idle { border-color: var(--idle); }
  svg text { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .node .body { fill: var(--bg); stroke-width: 2.5; }
  .node .ring { display: none; fill: none; stroke: var(--text); stroke-width: 1.5; }
  .s-guard .ring { display: block; }
  .node .nicon { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .node .label { fill: var(--text); font-size: 15px; font-weight: 600; text-anchor: middle; }
  .node .sub { fill: var(--faint); font-size: 14px; text-anchor: middle; }
  .node .tag rect { fill: var(--bg); stroke-width: 1.5; }
  .node .tag text { font-size: 14px; font-weight: 600; text-anchor: middle; fill: var(--text); }
  .s-ok .body, .s-ok .tag rect { stroke: var(--text); }
  .s-slow .body { stroke: var(--amber); stroke-dasharray: 2 7; stroke-linecap: round; } .s-slow .tag rect { stroke: var(--amber); } .s-slow .tag text { fill: var(--amber); }
  .s-bad .body, .s-bad .tag rect { stroke: var(--hot); } .s-bad .tag text { fill: var(--hot); }
  .s-attack .body { stroke: var(--hot); stroke-dasharray: 6 4; } .s-attack .tag rect { stroke: var(--hot); } .s-attack .tag text { fill: var(--hot); }
  .s-ai .body { stroke: var(--text); fill: var(--blue); } .s-ai .tag rect { stroke: var(--text); }
  .s-guard .body, .s-guard .tag rect { stroke: var(--text); }
  .s-idle .body { stroke: var(--idle); }
  .s-idle .nicon { stroke: var(--faint); }
  .pulse { fill: none; stroke: var(--hot); stroke-width: 2.5; opacity: 0; }
  .s-bad .pulse { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .8; r: 36; } 100% { opacity: 0; r: 60; } }
  .edge > path { fill: none; stroke-width: 2.5; }
  .e-ok > path, .e-guard > path { stroke: var(--text); } .e-ok .dot, .e-guard .dot { fill: var(--text); }
  .e-slow > path { stroke: var(--amber); stroke-dasharray: 2 6; stroke-linecap: round; } .e-slow .dot { fill: var(--amber); }
  .e-bad > path, .e-attack > path { stroke: var(--hot); stroke-dasharray: 8 6; } .e-bad .dot, .e-attack .dot { fill: var(--hot); }
  .e-ai > path { stroke: var(--blue); } .e-ai .dot { fill: var(--blue); }
  .e-idle > path { stroke: var(--idle); } .e-idle .dot { fill: var(--idle); }
  .edge .elabel rect { fill: var(--bg); stroke: var(--line); }
  .edge .elabel text { fill: var(--text); font-size: 14px; font-weight: 600; text-anchor: middle; }
  .edge .stop { fill: none; stroke: var(--hot); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .metric { background: var(--tint); border-radius: 24px; padding: 20px; box-shadow: var(--lift); backdrop-filter: blur(8px); }
  .metric .top { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .metric .top .ic { display: flex; }
  .metric .vals { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 24px; font-weight: 600; flex-wrap: wrap; }
  .metric .vals .before { color: var(--faint); }
  .metric .vals .to { display: inline-flex; align-items: center; gap: 8px; }
  .metric .vals .arrow { display: flex; color: var(--faint); font-size: 14px; }
  .metric .vals .after.bad { color: var(--hot); }
  .metric .vals .after.good { color: var(--text); }
  .metric .vals .after.warn { color: var(--amber); }
  .metric > svg { width: 100%; height: 56px; display: block; }
  .chartnote { margin-top: 8px; font-size: 14px; color: var(--faint); }
  .mission { border-top: 1px solid var(--line); }
  .mstep { display: grid; grid-template-columns: 32px 32px minmax(0, 1fr); gap: 16px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .mstep .k { font-size: 24px; font-weight: 600; line-height: 32px; text-align: center; background: var(--heading); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mstep .ic { display: flex; }
  .mstep .ic .i { width: 32px; height: 32px; }
  .mstep b { font-size: 18px; font-weight: 600; display: block; line-height: 1.35; }
  .mstep .where { color: var(--dim); margin-top: 4px; max-width: 80ch; }
  .mstep .who { display: inline-block; font-size: 14px; font-weight: 600; color: var(--amber); margin-bottom: 4px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 14px; background: var(--tint); border-radius: 16px; padding: 2px 12px; color: var(--text); overflow-wrap: anywhere; }
  .answer { background: var(--tint); border: 1px solid rgba(255, 255, 255, .8); border-radius: 24px; backdrop-filter: blur(8px); padding: 24px; display: grid; gap: 16px; overflow: hidden; box-shadow: 0 0 24px rgba(255, 255, 255, .4); }
  .fact { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 16px; align-items: start; font-size: 18px; line-height: 1.4; }
  .fact .ic { display: flex; }
  .fact .ic .i { width: 28px; height: 28px; }
  .why { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; padding: 32px; border-radius: 24px; box-shadow: var(--lift); background: radial-gradient(60% 120% at 100% 0, rgba(238, 29, 98, .45), transparent 70%), radial-gradient(45% 100% at 70% 110%, rgba(249, 157, 28, .35), transparent 70%), var(--card); }
  .why .ic { display: flex; }
  .why .ic .i { width: 48px; height: 48px; stroke: var(--text); }
  .why p { font-size: 22px; font-weight: 600; line-height: 1.35; max-width: 60ch; }
  .why p + p { margin-top: 8px; font-size: 16px; font-weight: 400; color: var(--dim); }
  .words { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
  .word { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
  .word .ic { display: flex; }
  .word .ic .i { width: 32px; height: 32px; }
  .word b { font-size: 18px; font-weight: 600; display: block; }
  .word span:not(.ic) { font-size: 15px; color: var(--dim); line-height: 1.4; display: block; }
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(0, 0, 0, .82); backdrop-filter: blur(10px); padding: 8px 16px; display: flex; gap: 8px; align-items: center; justify-content: center; }
  .actionbar button, .actionbar a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font: inherit; font-size: 15px; font-weight: 600; border-radius: 24px; padding: 8px 22px; cursor: pointer; text-decoration: none; border: 1px solid var(--text); background: transparent; color: var(--text); white-space: nowrap; }
  .actionbar a:hover, .actionbar button:hover { background: var(--tint); }
  .actionbar #reveal { background: var(--text); color: var(--ink); }
  .actionbar #reveal:hover { background: var(--dim); }
  .actionbar .start { background: var(--magenta); border-color: var(--magenta); color: var(--text); }
  .actionbar .start:hover { background: var(--hot); border-color: var(--hot); color: var(--bg); }
  .actionbar .start.running { background: transparent; border-color: var(--hot); color: var(--text); }
  .actionbar .start.running:hover { background: var(--tint); color: var(--text); }
  .actionbar .spacer { flex: 1; max-width: 48px; }
  .actionbar button:disabled { opacity: .6; cursor: wait; }
  .note { display: none; align-items: flex-start; gap: 8px; max-width: 1152px; margin: 16px auto 0; padding: 12px 16px; background: var(--card); border: 1px solid var(--amber); border-radius: 16px; font-size: 14px; }
  .note .i { margin-top: 2px; color: var(--amber); }
  .note a { color: var(--text); }
  .note.show { display: flex; }
  .keys { text-align: center; color: var(--faint); font-size: 14px; margin-top: 56px; }
  .keys kbd { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
  @media (max-width: 720px) {
    .topbar > div, main { padding-left: 16px; padding-right: 16px; }
    .topbar .logo, .back svg, .live, .keys { display: none; }
    .note { margin-left: 16px; margin-right: 16px; }
    section { margin-top: 48px; }
    .hero { grid-template-columns: 1fr; gap: 8px; margin-top: 32px; }
    .hero .badge .i { width: 48px; height: 48px; }
    .story { grid-auto-flow: row; }
    .panel .step::after { display: none; }
    .mstep { grid-template-columns: 24px 28px minmax(0, 1fr); gap: 8px; }
    .mstep .ic .i { width: 24px; height: 24px; margin-top: 4px; }
    .why { grid-template-columns: 1fr; padding: 24px; }
    .actionbar { padding: 8px; }
    .actionbar .spacer, .actionbar .wide { display: none; }
    .actionbar #prev, .actionbar #next { padding: 8px 10px; }
    .actionbar button { padding: 8px; flex: 1; justify-content: center; font-size: 14px; min-width: 0; white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { .s-bad .pulse, .spin { animation: none; } html { scroll-behavior: auto; } }
</style>

/* ---------- Rendering ---------- */
const $ = (id) => document.getElementById(id);
const NAME = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'baseline');
const ORDER = Object.keys(ACTS);
const A = ACTS[NAME];
let hidden = !(A && A.noAnswer) && location.hash !== '#answer';
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const icon = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const chips = (list) => list && list.length ? `<div class="chips">${list.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : '';

function renderDots() {
  const short = { baseline: 'Baseline', act1: '1', act2: '2', act3: '3', act4: '4', act4b: '4b', act5: '5', act6: '6', act7: '7' };
  $('dots').innerHTML = ORDER.map(k =>
    `<a href="/act/${k}" id="dot-${k}" class="${k === NAME ? 'here' : ''}" title="${esc(ACTS[k].title)}">${short[k] ? (k === 'baseline' ? '' : 'Act ') + short[k] : k}</a>`).join('');
  const i = ORDER.indexOf(NAME);
  const prev = ORDER[i - 1], next = ORDER[i + 1];
  $('prev').href = prev ? `/act/${prev}` : '/';
  const name = (k) => k === 'baseline' ? 'Baseline' : ACTS[k].kicker;
  $('prev').innerHTML = icon('chevron-left') + `<span class="wide">${esc(prev ? name(prev) : 'Controls')}</span>`;
  $('prev').setAttribute('aria-label', `Previous: ${prev ? name(prev) : 'Controls'}`);
  $('next').href = next ? `/act/${next}` : '/';
  $('next').innerHTML = `<span class="wide">${esc(next ? name(next) : 'Controls')}</span>` + icon('chevron-right');
  $('next').setAttribute('aria-label', `Next: ${next ? name(next) : 'Controls'}`);
}

/* The diagram: nodes on a grid, arrows with moving dots showing traffic. */
function renderFlow(flow) {
  const X0 = 92, ROWH = 205, Y0 = 92;
  const nodes = flow.nodes.filter(n => !(hidden && n.answerOnly));
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const maxCol = Math.max(...flow.nodes.map(n => n.col)), maxRow = Math.max(...nodes.map(n => n.row));
  const COLW = Math.min(230, Math.max(168, (1000 - X0 * 2) / Math.max(1, maxCol)));
  const W = Math.max(1000, X0 * 2 + maxCol * COLW), H = Y0 + maxRow * ROWH + 96;
  const pos = (n) => ({ x: X0 + n.col * COLW + (W - (X0 * 2 + maxCol * COLW)) / 2, y: Y0 + n.row * ROWH });
  const view = (item) => hidden ? (item.hint || { status: 'idle' }) : item;

  const edges = flow.edges.filter(e => byId[e.from] && byId[e.to]).map((e, i) => {
    const v = view(e), st = v.status || 'ok';
    const a = pos(byId[e.from]), b = pos(byId[e.to]);
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    // Leaving downward or arriving from below: clear the node's name + subtitle text under the circle.
    // Arriving from above onto a node with a tag: stop above the tag.
    const tagged = !!view(byId[e.to]).tag, sourceTagged = !!view(byId[e.from]).tag;
    const s0 = uy > 0.3 ? 42 + 44 * uy : uy < -0.5 && sourceTagged ? 80 / -uy : 42, e0 = uy < -0.3 ? 48 + 44 * -uy : uy > 0.3 && tagged ? 48 + 34 * uy : 48;
    const sx = a.x + ux * s0, sy = a.y + uy * s0, ex = b.x - ux * e0, ey = b.y - uy * e0;
    // A downward diagonal becomes a right angle that leaves below the name and subtitle under the circle.
    const elbow = Math.abs(ux) > 0.3 && uy > 0.3;
    // Elbows from one node run side by side, so each keeps its own colour.
    const sibs = flow.edges.filter(o => o.from === e.from && byId[o.to] && byId[o.to].row > byId[o.from].row && byId[o.to].col !== byId[o.from].col);
    const ox = a.x + (sibs.indexOf(e) - (sibs.length - 1) / 2) * 12;
    const route = elbow ? [[ox, a.y + 86], [ox, b.y], [b.x - Math.sign(dx) * 48, b.y]] : [[sx, sy], [ex, ey]];
    const d = route.map((p, k) => `${k ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const dur = st === 'slow' ? 5 : st === 'idle' ? 3 : 1.8;
    const broken = st === 'bad' && !e.stop;
    const dots = reduceMotion ? '' : [0, 1, 2].map(k =>
      `<circle class="dot" r="5"><animateMotion dur="${dur}s" repeatCount="indefinite" begin="-${(dur * k / 3).toFixed(2)}s" path="${d}"
        ${broken ? 'keyPoints="0;0.5;0.5" keyTimes="0;0.6;1" calcMode="linear"' : ''}/></circle>`).join('');
    const seg = elbow ? route.slice(1) : route;
    // Labels on upward diagonals sit nearer the start, clear of the text under the target.
    const f = uy < -0.5 && Math.abs(ux) > 0.3 ? 0.35 : 0.5;
    const mx = seg[0][0] + (seg[1][0] - seg[0][0]) * f, my = seg[0][1] + (seg[1][1] - seg[0][1]) * f;
    // Flat arrows: label above, X mark below. Angled/vertical arrows: label to the right, X mark to the left.
    const flat = elbow || Math.abs(uy) < 0.3;
    const label = v.label ? (() => {
      const w = v.label.length * 8.3 + 16, cx = flat ? mx : mx + w / 2 + 12, cy = flat ? my - 14 : my;
      return `<g class="elabel"><rect x="${(cx - w / 2).toFixed(1)}" y="${(cy - 10).toFixed(1)}" width="${w.toFixed(1)}" height="20" rx="10"/><text x="${cx.toFixed(1)}" y="${(cy + 4).toFixed(1)}">${esc(v.label)}</text></g>`; })() : '';
    const mark = broken ? `<use class="stop" href="#i-x" x="${((flat ? mx : mx - 22) - 11).toFixed(1)}" y="${((flat ? my + 26 : my + 8) - 16).toFixed(1)}" width="22" height="22"/>` : '';
    return `<g class="edge e-${st}"><path d="${d}" marker-end="url(#arrow-${st})"/>${dots}${label}${mark}</g>`;
  }).join('');

  const nodeSvg = nodes.map(n => {
    const v = view(n), st = v.status || 'idle', p = pos(n);
    const tag = v.tag ? (() => { const w = [...v.tag].length * 8.3 + 20; return `<g class="tag"><rect x="${(-w / 2).toFixed(1)}" y="-70" width="${w.toFixed(1)}" height="24" rx="12"/><text y="-54">${esc(v.tag)}</text></g>`; })() : '';
    return `<g class="node s-${st}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">
      <circle class="pulse" r="36"/><circle class="body" r="36"/><circle class="ring" r="30"/>
      <use class="nicon" href="#i-${n.icon}" x="-17" y="-17" width="34" height="34"/>
      <text class="label" y="58">${esc(n.label)}</text><text class="sub" y="76">${esc(n.sub || '')}</text>${tag}</g>`;
  }).join('');

  const colors = { ok: '#FFFFFF', slow: '#FFAB0F', bad: '#FF0F7B', attack: '#FF0F7B', ai: '#0064DA', guard: '#FFFFFF', idle: '#6E6F75' };
  const markers = Object.entries(colors).map(([k, c]) =>
    `<marker id="arrow-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('');
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagram of the payment path for this act"><defs>${markers}</defs>${edges}${nodeSvg}</svg>`;
}

/* Tiny line chart: steady, then the change at 60% of the way (up / down / flat). */
function sparkline(trend, tone) {
  const N = 40, W = 300, H = 54, pts = [];
  let seed = trend.length * 7 + tone.length;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let i = 0; i < N; i++) {
    let v = 0.3 + (rnd() - 0.5) * 0.08;
    const t = i / (N - 1);
    if (t > 0.6 && trend !== 'flat') { const k = Math.min(1, (t - 0.6) / 0.12); v += (trend === 'up' ? 0.5 : -0.22) * k; }
    pts.push([t * W, H - 6 - v * (H - 12)]);
  }
  const color = { bad: '#FF0F7B', warn: '#FFAB0F', good: '#FFFFFF' }[tone] || '#A6ADB6';
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="${W * 0.6}" y1="0" x2="${W * 0.6}" y2="${H}" stroke="#6E6F75" stroke-dasharray="3 4"/>
    <path d="${line} L${W},${H} L0,${H} Z" fill="${color}" opacity=".24"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function veil() { return `<button class="veil" onclick="toggleAnswer()" title="Show the answer"><span>${icon('eye-off')}Answer hidden<br>Find it in Splunk</span></button>`; }

function render() {
  if (!A) { $('page').innerHTML = `<section><h2>Unknown act</h2><p><a href="/">Back to controls</a></p></section>`; return; }
  document.title = `${NAME === 'baseline' ? 'Baseline' : A.kicker} · ${A.title}`;
  document.body.classList.toggle('hidden', hidden);
  const h = (t) => `<h2>${t}</h2>`;
  $('page').innerHTML = `
    <section class="hero">
      <div class="badge">${icon(A.icon)}</div>
      <div>
        <div class="kicker">${esc(A.kicker)}</div>
        <h1>${esc(A.title)}</h1>
        <p class="line">${esc(A.line)}</p>
        <div class="skills"><span class="lbl">You will practise:</span>${A.skills.map(s => `<span class="skill">${esc(s)}</span>`).join('')}</div>
      </div>
    </section>

    <section>${h('What happens')}
      <div class="story">${A.story.map((p, i) => `
        <div class="panel ${p.tone || ''} ${p.spoiler ? 'spoiler' : ''}"><span class="step">${i + 1}</span>
          <div class="pic glow">${icon(p.icon)}</div><b>${esc(p.head)}</b><p>${esc(p.text)}</p>${p.spoiler ? veil() : ''}</div>`).join('')}
      </div>
    </section>

    <section>${h('The payment path')}
      <div class="diagram">
        <div class="fog">${icon('help-circle')}Something inside is broken. Find where in Splunk.</div>
        <div class="scroll">${renderFlow(A.flow)}</div>
        <div class="legend">
          <span><i class="l-ok"></i>Healthy</span><span><i class="l-slow"></i>Slow</span>
          <span><i class="l-bad"></i>Broken / attack</span><span><i class="l-ai"></i>AI</span>
          <span><i class="l-guard"></i>Safety check</span>${hidden && !A.noAnswer ? '<span><i class="l-idle"></i>Unknown yet</span>' : ''}
        </div>
      </div>
    </section>

    <section>${h('What you will see')}
      <div class="metrics">${A.metrics.map(m => `
        <div class="metric"><div class="top"><span class="ic">${icon(m.icon)}</span>${esc(m.label)}</div>
          <div class="vals"><span class="before">${esc(m.before)}</span><span class="to"><span class="arrow">${icon('arrow-right')}</span><span class="after ${m.tone}">${esc(m.after)}</span></span></div>
          ${sparkline(m.trend, m.tone)}</div>`).join('')}
      </div>
      <p class="chartnote">The small charts show the expected shape, not live data.</p>
    </section>

    <section>${h('Your mission in Splunk')}
      <div class="mission">${A.mission.map((s, i) => `
        <div class="mstep"><span class="k">${i + 1}</span><div class="ic glow">${icon(s.icon)}</div>
          <div>${s.who ? `<span class="who">${esc(s.who)}</span>` : ''}<b>${esc(s.title)}</b><div class="where">${esc(s.where)}</div>${chips(s.chips)}</div></div>`).join('')}
      </div>
    </section>

    ${A.answer ? `<section>${h('The answer')}
      <div class="answer spoiler">${A.answer.map(f => `
        <div class="fact"><span class="ic glow">${icon(f.icon)}</span><div>${esc(f.text)}${chips(f.chips)}</div></div>`).join('')}${veil()}
      </div>
    </section>` : ''}

    <section>${h('Why this act?')}
      <div class="why"><span class="ic">${icon('target-arrow')}</span><div>${A.why.map(p => `<p>${esc(p)}</p>`).join('')}</div></div>
    </section>

    <section>${h('Words to know')}
      <div class="words">${A.words.map(w => `
        <div class="word"><span class="ic glow">${icon(w.icon)}</span><div><b>${esc(w.word)}</b><span>${esc(w.meaning)}</span></div></div>`).join('')}
      </div>
    </section>`;
  $('reveal').style.display = A.noAnswer ? 'none' : '';
  $('reveal').innerHTML = hidden ? icon('eye') + '<span>Show<span class="wide"> the answer</span></span>' : icon('eye-off') + '<span>Hide<span class="wide"> the answer</span></span>';
}

function toggleAnswer() {
  if (!A || A.noAnswer) return;
  hidden = !hidden;
  history.replaceState(null, '', hidden ? location.pathname : '#answer');
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

/* ---------- Live status + actions (same endpoints as the controls page) ---------- */
let running = null;
function renderLive() {
  const on = running === NAME;
  $('live').classList.toggle('on', on);
  $('live').textContent = on ? 'Running now' : running ? `${running === 'baseline' ? 'Baseline' : (ACTS[running] ? ACTS[running].kicker : running)} is running` : 'Nothing running';
  $('start').classList.toggle('running', on);
  if (!$('start').disabled) $('start').innerHTML = on ? icon('refresh') + '<span>Restart<span class="wide"> this act</span></span>' : icon('player-play') + '<span>Start<span class="wide"> this act</span></span>';
  document.querySelectorAll('.dots a').forEach(a => a.classList.toggle('running', a.id === `dot-${running}`));
}
// Every request has an 8 s timeout: after the laptop wakes up, or while the controller pod
// restarts, a hanging fetch would otherwise leave the buttons disabled for good.
async function fetchT(path, options) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 8000);
  try { return await fetch(path, { ...options, signal: ctl.signal }); } finally { clearTimeout(timer); }
}
async function poll() {
  try {
    const [cur, traffic] = await Promise.all([fetchT('/scenarios/current').then(r => r.json()), fetchT('/traffic').then(r => r.json())]);
    running = cur.name; renderLive();
    $('paused-note').classList.toggle('show', !!traffic.paused);
  } catch (e) { console.warn('controller not answering, keeping the last state', e); }
}
// A failed call (controller restarting, laptop network not back yet) is shown on the button for
// a few seconds instead of being swallowed, so nobody keeps clicking a dead page. Starting an
// act while traffic is paused resumes the traffic (the controller says so with traffic_resumed).
async function call(button, label, path) {
  const original = button.innerHTML; button.disabled = true; button.innerHTML = icon('loader-2', 'spin') + label;
  try {
    const res = await fetchT(path, { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json().catch(() => ({}));
    button.disabled = false; await poll();         // renderLive() refreshes the Start button's own label
    if (button.id !== 'start') button.innerHTML = original;
    if (data.traffic_resumed) {
      button.innerHTML = icon('check') + 'Started. Traffic was paused, now resumed';
      setTimeout(() => { if (button.id === 'start') renderLive(); else button.innerHTML = original; }, 5000);
    }
  } catch (e) {
    console.error(e);
    button.innerHTML = icon('alert-triangle') + 'Controller unreachable. Try again';
    button.disabled = false; setTimeout(() => { if (button.id === 'start') renderLive(); else button.innerHTML = original; }, 4000);
  } finally { button.disabled = false; }
}
async function startAct() { await call($('start'), 'Starting', `/scenarios/${NAME}`); }
async function resetAll() { await call($('reset'), 'Resetting', '/reset'); }

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft') location.href = $('prev').href;
  else if (e.key === 'ArrowRight') location.href = $('next').href;
  else if (e.key === 'a' || e.key === 'A') toggleAnswer();
});

renderDots(); render(); poll(); setInterval(poll, 5000);
</script>
